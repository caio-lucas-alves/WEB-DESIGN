 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tabelas</title>

    <style>
        table {
            border: 1px solid black;
            margin: 20px auto;
            border-collapse: separate;
        }

        td, th {
            border: 1px solid black;
            padding: 4px 8px;
            font-size: 20px;
            text-align: left;
        }

        h3 {
            margin-left: 20px;
        }
    </style>
</head>

<body>
 
 <h3>d)</h3>

    <table>
        <tr>
            <td>A</td>
            <td>B</td>
            <td rowspan="3">C</td>
        </tr>

        <tr>
            <td colspan="2">D</td>
        </tr>

        <tr>
            <td>E</td>
            <td>F</td>
        </tr>
    </table>

</body>
</html>
