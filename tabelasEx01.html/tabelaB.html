 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tabelas</title>

    <style>
        table {
            border: 1px solid black;
            margin: 20px auto;
            border-collapse: separate;
        }

        td, th {
            border: 1px solid black;
            padding: 4px 8px;
            font-size: 20px;
            text-align: left;
        }

        h3 {
            margin-left: 20px;
        }
    </style>
</head>

<body>



<h3>b)</h3>

    <table>
        <tr>
            <td>A</td>
            <td rowspan="3">B</td>
            <td>C</td>
        </tr>

        <tr>
            <td>D</td>
            <td>E</td>
        </tr>

        <tr>
            <td>F</td>
            <td>G</td>
        </tr>
    </table>
