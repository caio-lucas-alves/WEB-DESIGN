  <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tabelas</title>

    <style>
        table {
            border: 1px solid black;
            margin: 20px auto;
            border-collapse: separate;
        }

        td, th {
            border: 1px solid black;
            padding: 4px 8px;
            font-size: 20px;
            text-align: left;
        }

        h3 {
            margin-left: 20px;
        }
    </style>
</head>

<body>
  
  <h3>c)</h3>

    <table>
        <tr>
            <td>A</td>
            <td>B</td>
            <td>C</td>
            <td>D</td>
            <td>E</td>
            <td>F</td>
            <td>G</td>
        </tr>

        <tr>
            <td>H</td>
            <td>I</td>
            <td colspan="2">J</td>
            <td colspan="2">K</td>
        </tr>

        <tr>
            <td>L</td>
            <td>M</td>
            <td>N</td>
            <td colspan="2">O</td>
            <td>P</td>
        </tr>
    </table>
